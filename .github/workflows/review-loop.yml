# Codex review -> Claude Code fix -> CI -> Codex re-review loop.
#
# Kill switch: this workflow does nothing unless the repository variable
# REVIEW_LOOP_ENABLED is exactly `true`. See docs/runbooks/review-loop.md.
#
# Trust boundaries (each job gets only what it needs):
#   triage  - default-branch code, read-only token. Decides from the API, never
#             from the event payload.
#   claim   - posts the attempt claim (GITHUB_TOKEN, pull-requests: write).
#   fix     - Claude Code (official action) with the Anthropic key, a read-only
#             token, and only Read/Edit/Write/Glob/Grep tools: no shell, no
#             network, so it never executes pull-request code.
#   verify  - applies the patch and runs the test suite. Runs pull-request
#             code, so it has no secrets and a read-only token.
#   push    - re-checks the patch and the claim, commits and pushes with the
#             review-loop App token (contents: write, no workflows permission),
#             then asks Codex for a fresh review. No Anthropic key here.
#   report  - posts the outcome and, on any failure, the halted label.
# Nothing here merges, approves, or changes branch protection.
name: review-loop

on:
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [codex-review-relay, ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to triage
        required: true
        type: number

permissions: {}

# Only events that can lead to action share the per-PR group. Everything else
# (other people's comments, successful CI, non-Codex reviews) gets a group of
# its own: a queued run replaces the pending run in its group, so a no-op event
# must never be able to displace a pending Codex event.
concurrency:
  group: >-
    review-loop-${{
      (
        (github.event_name == 'issue_comment' && github.event.comment.user.id == 199175422) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'codex-review-relay' && github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ci' && github.event.workflow_run.conclusion == 'failure') ||
        github.event_name == 'workflow_dispatch'
      )
      && format('pr-{0}', github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 'unknown')
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  triage:
    # Cheap pre-filter only; the real identity and freshness checks are in
    # automation/review_loop (199175422 = chatgpt-codex-connector[bot]).
    if: >-
      vars.REVIEW_LOOP_ENABLED == 'true' && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.id == 199175422) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'codex-review-relay' && github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ci' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      action: ${{ steps.triage.outputs.action }}
      reason: ${{ steps.triage.outputs.reason }}
      head_sha: ${{ steps.triage.outputs.head_sha }}
      head_ref: ${{ steps.triage.outputs.head_ref }}
      attempt: ${{ steps.triage.outputs.attempt }}
      report_key: ${{ steps.triage.outputs.report_key }}
    steps:
      - name: Check out the default branch (trusted code only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require Python 3.12+
        run: python3 -I -c 'import sys; assert sys.version_info >= (3, 12), sys.version'

      - name: Resolve the pull request
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I automation/review_loop/cli.py resolve

      - name: Triage
        id: triage
        if: steps.resolve.outputs.pr != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ steps.resolve.outputs.pr }}
          CI_FAILED_SHA: ${{ github.event.workflow_run.name == 'ci' && github.event.workflow_run.head_sha || '' }}
        run: |
          python3 -I automation/review_loop/cli.py triage --pr "$PR" --out "$RUNNER_TEMP/review-loop-input" --ci-failed-sha "$CI_FAILED_SHA"

      - name: Hand the findings to the fix job
        if: steps.triage.outputs.action == 'fix'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-loop-input
          path: ${{ runner.temp }}/review-loop-input/
          retention-days: 7
          if-no-files-found: error

  claim:
    needs: triage
    if: needs.triage.outputs.action == 'fix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      won: ${{ steps.claim.outputs.won }}
      attempt: ${{ steps.claim.outputs.attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Claim the attempt for this head commit
        id: claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ needs.triage.outputs.pr }}
          HEAD_SHA: ${{ needs.triage.outputs.head_sha }}
        run: python3 -I automation/review_loop/cli.py claim --pr "$PR" --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID"

  fix:
    needs: [triage, claim]
    if: needs.claim.outputs.won == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: review-loop-claude
    permissions:
      contents: read
      pull-requests: read
    outputs:
      patch_sha256: ${{ steps.patch.outputs.sha256 }}
    steps:
      - name: Check out the PR head commit (no credentials kept)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.triage.outputs.head_sha }}
          persist-credentials: false

      - name: Refuse symlinks in the checkout
        # A symlink could point Claude's file tools outside the workspace
        # (the runner's file-command directory, /proc). The project has none.
        run: |
          links="$(find . -path ./.git -prune -o -type l -print)"
          if [ -n "$links" ]; then echo "::error::symlinks in the checkout"; echo "$links"; exit 1; fi

      - name: Set aside PR-controlled Claude configuration
        # These files are read by Claude Code or its tools at startup (hooks,
        # MCP servers, instructions, ripgrep options). The PR's copies must not
        # be used in a job that holds the Anthropic key. Same list as the
        # action's SENSITIVE_PATHS, plus nested CLAUDE*.md.
        run: |
          held="$RUNNER_TEMP/held"
          mkdir -p "$held"
          find . -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md \) -print > "$held/list"
          for p in .claude .claude.json .mcp.json .gitmodules .ripgreprc .husky; do
            if [ -e "$p" ]; then echo "./$p" >> "$held/list"; fi
          done
          if [ -s "$held/list" ]; then
            tar -cf "$held/files.tar" -T "$held/list"
            xargs -d '\n' rm -rf < "$held/list"
          fi
          # Pristine copy of the git metadata, outside the workspace, so the
          # patch is built with config and hooks Claude never had access to.
          cp -a .git "$RUNNER_TEMP/pristine.git"

      - name: Fetch the findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-loop-input
          path: .review-loop/

      - name: Load the prompt
        id: prompt
        run: |
          {
            echo "text<<REVIEW_LOOP_PROMPT_EOF"
            cat .review-loop/prompt.md
            echo "REVIEW_LOOP_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          # The run is started by a Codex event; the action refuses bot actors
          # unless named. Identity was already proven by numeric id in triage.
          allowed_bots: chatgpt-codex-connector
          classify_inline_comments: "false"
          # Deny rules keep the file tools inside the checkout: no process
          # environment (/proc), no runner temp dir (file commands, pristine git
          # copy, held files), no git metadata, no workflows.
          settings: >-
            {"disableAllHooks": true, "permissions": {"deny": [
            "Bash", "WebFetch", "WebSearch",
            "Read(//proc/**)", "Read(//sys/**)", "Read(//dev/**)", "Read(//etc/**)", "Read(//tmp/**)",
            "Read(//home/runner/work/_temp/**)", "Edit(//home/runner/work/_temp/**)", "Write(//home/runner/work/_temp/**)",
            "Read(//home/runner/work/_actions/**)", "Edit(//home/runner/work/_actions/**)",
            "Read(//home/runner/.claude/**)", "Edit(//home/runner/.claude/**)",
            "Read(//home/runner/runners/**)", "Read(//home/runner/actions-runner/**)",
            "Read(./.git/**)", "Edit(./.git/**)", "Write(./.git/**)",
            "Edit(./.github/**)", "Write(./.github/**)"]}}
          claude_args: >-
            --model ${{ vars.REVIEW_LOOP_CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep"
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit,Task"
            --json-schema '{"type":"object","additionalProperties":false,"required":["findings","summary"],"properties":{"summary":{"type":"string","maxLength":4000},"findings":{"type":"array","maxItems":40,"items":{"type":"object","additionalProperties":false,"required":["comment_id","verdict","reason"],"properties":{"comment_id":{"type":"integer"},"verdict":{"enum":["fixed","not_a_bug","already_fixed","needs_human"]},"reason":{"type":"string","maxLength":2000}}}}}}'

      - name: Restore the PR's Claude configuration
        if: always()
        env:
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: ""
        run: |
          held="$RUNNER_TEMP/held"
          for p in .claude .claude.json .mcp.json .gitmodules .ripgreprc .husky; do rm -rf "./$p"; done
          find . -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md \) -print0 | xargs -0 rm -f
          if [ -f "$held/files.tar" ]; then tar -xf "$held/files.tar"; fi

      - name: Build the patch (with the pristine git metadata)
        id: patch
        env:
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: ""
          VERDICTS: ${{ steps.claude.outputs.structured_output }}
        run: |
          out="$RUNNER_TEMP/review-loop-patch"
          mkdir -p "$out"
          printf '%s' "$VERDICTS" > "$out/verdicts.json"
          g() { git --git-dir="$RUNNER_TEMP/pristine.git" --work-tree="$PWD" -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          g add -A -- . ':(exclude).review-loop'
          g diff --cached --binary --no-color --no-ext-diff --no-textconv > "$out/patch.diff"
          # Nothing credential-shaped may leave this job (the model ran beside the key).
          if grep -Eq 'sk-ant-[A-Za-z0-9_-]{8}|gh[pousr]_[A-Za-z0-9]{20}|github_pat_|PRIVATE KEY-----|x-access-token:' "$out/patch.diff" "$out/verdicts.json"; then
            rm -f "$out/patch.diff" "$out/verdicts.json"
            echo "::error::credential-shaped value in the model output; nothing uploaded"
            exit 1
          fi
          echo "sha256=$(sha256sum "$out/patch.diff" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-loop-patch
          path: ${{ runner.temp }}/review-loop-patch/
          retention-days: 1
          if-no-files-found: error

  verify:
    # Runs pull-request code (the test suite): no secrets, read-only token.
    needs: [triage, fix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.policy.outputs.ok }}
      empty: ${{ steps.policy.outputs.empty }}
      needs_human: ${{ steps.policy.outputs.needs_human }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.triage.outputs.head_sha }}
          persist-credentials: false
      - name: Check out the policy code from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .review-loop/trusted
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-loop-patch
          path: ${{ runner.temp }}/patch
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-loop-input
          path: ${{ runner.temp }}/input
      - name: Patch policy (trusted code, before any PR code runs)
        id: policy
        env:
          SHA256: ${{ needs.fix.outputs.patch_sha256 }}
        run: |
          python3 -I .review-loop/trusted/automation/review_loop/cli.py check-patch \
            --patch "$RUNNER_TEMP/patch/patch.diff" \
            --verdicts "$RUNNER_TEMP/patch/verdicts.json" \
            --findings "$RUNNER_TEMP/input/findings.json" \
            --expect-sha256 "$SHA256" \
            --repo .
      - name: Apply the patch
        if: steps.policy.outputs.empty == 'false'
        run: |
          rm -rf .review-loop
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/patch/patch.diff"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: steps.policy.outputs.empty == 'false'
        with:
          python-version: "3.12"
      - name: Test suite (mirrors ci.yml)
        if: steps.policy.outputs.empty == 'false'
        env:
          SOAR_BASE_URL: ""
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q --cov=qradar_soar_mcp --cov-report=term-missing --cov-fail-under=80
          uv run coverage report --include="src/qradar_soar_mcp/security/*" --fail-under=95
          uv run python scripts/check_no_secrets.py

  push:
    needs: [triage, claim, fix, verify]
    if: needs.verify.result == 'success' && needs.verify.outputs.ok == 'true' && needs.verify.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: review-loop
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      pushed_sha: ${{ steps.commit.outputs.pushed_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.triage.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .review-loop/trusted
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-loop-patch
          path: ${{ runner.temp }}/patch
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-loop-input
          path: ${{ runner.temp }}/input
      - name: Re-check the patch (digest from the fix job)
        env:
          SHA256: ${{ needs.fix.outputs.patch_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cp -r .review-loop/trusted/automation "$RUNNER_TEMP/bin/"
          rm -rf .review-loop
          python3 -I "$RUNNER_TEMP/bin/automation/review_loop/cli.py" check-patch \
            --patch "$RUNNER_TEMP/patch/patch.diff" \
            --verdicts "$RUNNER_TEMP/patch/verdicts.json" \
            --findings "$RUNNER_TEMP/input/findings.json" \
            --expect-sha256 "$SHA256" \
            --repo .
      - name: Mint a push App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_LOOP_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_LOOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit, re-check the claim, push (fast-forward only)
        id: commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ needs.triage.outputs.pr }}
          HEAD_SHA: ${{ needs.triage.outputs.head_sha }}
          BRANCH: ${{ needs.triage.outputs.head_ref }}
          ATTEMPT: ${{ needs.claim.outputs.attempt }}
        run: |
          cli="$RUNNER_TEMP/bin/automation/review_loop/cli.py"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/patch/patch.diff"
          git -c user.name=qradar-soar-review-loop -c user.email=review-loop@users.noreply.github.com \
            commit --no-verify -q -F - <<EOF
          fix: address Codex review findings (automated attempt $ATTEMPT/3)

          Automated fix for the unresolved Codex findings on $HEAD_SHA.
          Patch checked by the review-loop policy and the test suite before push.

          Review-Loop-Attempt: $ATTEMPT/3
          Review-Loop-Reviewed-Head: $HEAD_SHA
          EOF
          python3 -I "$cli" prepush --pr "$PR" --head "$HEAD_SHA" --branch "$BRANCH" --attempt "$ATTEMPT"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # A plain push: it is refused if the branch moved (never forced).
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --no-verify "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Ask Codex for a fresh review of the new head
        env:
          REVIEW_LOOP_APP_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_LOOP_REQUEST_TOKEN: ${{ secrets.REVIEW_LOOP_REQUEST_TOKEN }}
          PR: ${{ needs.triage.outputs.pr }}
          NEW_SHA: ${{ steps.commit.outputs.pushed_sha }}
        run: python3 -I "$RUNNER_TEMP/bin/automation/review_loop/cli.py" rereview --pr "$PR" --head "$NEW_SHA"

  report:
    needs: [triage, claim, fix, verify, push]
    if: >-
      always() && needs.triage.result == 'success' && (
        needs.triage.outputs.action == 'halt' ||
        needs.triage.outputs.action == 'report' ||
        needs.claim.outputs.won == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.fix.result == 'success'
        continue-on-error: true
        with:
          name: review-loop-patch
          path: ${{ runner.temp }}/patch
      - name: Report the outcome
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ needs.triage.outputs.pr }}
          ACTION: ${{ needs.triage.outputs.action }}
          REASON: ${{ needs.triage.outputs.reason }}
          KEY: ${{ needs.triage.outputs.report_key }}
          HEAD_SHA: ${{ needs.triage.outputs.head_sha }}
          FIX: ${{ needs.fix.result }}
          VERIFY: ${{ needs.verify.result }}
          VERIFY_OK: ${{ needs.verify.outputs.ok }}
          VERIFY_EMPTY: ${{ needs.verify.outputs.empty }}
          NEEDS_HUMAN: ${{ needs.verify.outputs.needs_human }}
          PUSH: ${{ needs.push.result }}
          PUSHED_SHA: ${{ needs.push.outputs.pushed_sha }}
        run: |
          cli=automation/review_loop/cli.py
          verdicts="$RUNNER_TEMP/patch/verdicts.json"
          [ -f "$verdicts" ] || verdicts=""
          if [ "$ACTION" = halt ] || [ "$ACTION" = report ]; then
            exec python3 -I "$cli" report --pr "$PR" --outcome "$ACTION" --key "$KEY" --reason "$REASON"
          fi
          if [ "$FIX" != success ]; then outcome=claude-failed
          elif [ "$NEEDS_HUMAN" = true ]; then outcome=needs-human
          elif [ "$VERIFY_OK" != true ]; then outcome=policy-failed
          elif [ "$VERIFY" != success ]; then outcome=tests-failed
          elif [ "$VERIFY_EMPTY" = true ]; then outcome=no-change
          elif [ -n "$PUSHED_SHA" ] && [ "$PUSH" != success ]; then outcome=rereview-failed
          elif [ "$PUSH" != success ]; then outcome=push-refused
          else outcome=pushed
          fi
          python3 -I "$cli" report --pr "$PR" --outcome "$outcome" --head "$HEAD_SHA" --verdicts "$verdicts"
